[package]
name = "native-cron"
version = "0.1.2"
edition = "2021"
rust-version = "1.98"
authors = ["The-Best-Codes"]
description = "Cross-platform OS-level cron scheduling for Rust. No daemon, timers, or resident process."
license = "MIT"
repository = "https://github.com/The-Best-Codes/native-cron-rs"
homepage = "https://github.com/The-Best-Codes/native-cron-rs"
readme = "README.md"
keywords = ["cron", "launchd", "systemd", "scheduler", "task-scheduler"]
categories = ["os", "date-and-time"]

[dependencies]
thiserror = "2"
which = "8"
plist = "1.10"
quick-xml = "0.42"
systemd-unit-edit = "0.1"

[target.'cfg(target_os = "windows")'.dependencies]
chrono = "0.4"

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
